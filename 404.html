<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - RGOPage Not Found</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300&display=swap');
    *{
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html{
      font-family: "Space Grotesk", sans-serif;
      font-optical-sizing: auto;
      font-weight: 300;
      font-style: normal;
      font-size: clamp(1.8rem, 1.2rem + 2.5vw, 3rem);
      background-color: #000;
      height: 100%;
      overflow: hidden;
    }
    body{
      background-color: #000;
      height: 100%;
    }
    .background{
      height: 100%;

    }
    .background-text{
      padding: .1rem;
      border-radius: 999px;
      background-color: rgba(0, 0, 0, .5);
      white-space: nowrap;
      overflow: hidden;
      position: absolute;
      color: white;
      left: 0%;
      opacity: 0%;
      transform: translateX(-100%) translateY(-50%);
    }
    @keyframes backgroundTextMove {
      from{
        display: flex;
        left: 0%;
        transform: translateX(-100%) translateY(-50%);
      }
      to{
        display: none;
        left: 100%;
        transform: translateX(0%) translateY(-50%);
      }
    }
  </style>
  <script defer>
    function getRandomArbitrary(min, max) {
      return Math.random() * (max - min) + min;
    }
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    function getRandomText() {
      switch (getRandomInt(1, 10)) {
        case 1:
          return "RGOPages";
        case 2:
          return "Not Found!";
        case 3:
          return "Lost?";
        case 4:
          return "Nothing Here.";
        case 5:
          return "Void.";
        case 6:
          return "Error!";
        case 7:
          return "Nope.";
        case 8:
          return "Page Missing!";
        case 9:
          return "???";
        default:
          return "404";
      }
    }
    function addBackgroundText() {
      document.querySelector(".background").innerHTML += 
      `
        <div
          class="background-text"
          style="
            font-size: .${getRandomInt(5,9)}rem;
            animation: backgroundTextMove 10s linear infinite ${getRandomArbitrary(1,11)}s;
            opacity: ${getRandomInt(50,70)}%;
            top: ${getRandomInt(0,100)}%;
          "
          >${getRandomText()}
        </div>
      `
    }
    function addBackgroundTexts() {
      for (let i = 0; i < Math.floor(window.innerWidth / 30); i++) {
        addBackgroundText()
      }
    }
  </script>
</head>
<body onload="addBackgroundTexts()">
  <div class="background"></div>
  
</body>
</html>
