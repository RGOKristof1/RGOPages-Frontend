<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="/rustyrackdemo/global-source/rustyDeerWithEye.png" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
  <link rel="stylesheet" href="global-source/alap-style.css">
  <link rel="stylesheet" href="rusty-main-source/style.css">
  <title id="title">Főoldal</title>
</head>
<body>
  <header>
    <div id="header-left">
      <a href="/rustyrackdemo/"><img src="global-source/rustyDeerNoEye.png" alt="deer" id="logo-img" loading="lazy"></a>
      <button id="lang-selector" onclick="toggleLanguage()">
        <img src="global-source/american-flag.webp" alt="usa-flag" id="lang-img">
        <p id="lang-text">EN</p>
      </button> 
    </div>

    <div id="header-center">
      <a href="/rustyrackdemo/"><img src="global-source/rustyBanner.webp" alt="banner" id="banner-img" loading="lazy"></a>
    </div>

    <div id="header-right">
      <a href="etlap/" id="etlap-button">Etlap</a>
    </div>
  </header>

  <main>
    <div class="swiper mySwiper hero">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <section>
            <h1 id="rendelj-text">Rendelj</h1><p id="rendelj-p">Rendelj a woltrol, ugyan olyan frissen kapod!</p><h2>Heltai Jeno ter 2.</h2>
          </section>
          <img src="global-source/rustyBurger.jpg" alt="burger">
        </div>
        <div class="swiper-slide">
          <img src="global-source/rustyRib.png" alt="oldalas">
          <section>
            <h1>BBQ Time</h1><p id="bbq-p">Ha szombat, akkor oldalas a Rusty Rack-ben!</p><h2>Heltai Jeno ter 2.</h2>
          </section>
        </div>
        <div class="swiper-slide">
          <section>
            <h1 id="kostoldMeg-text">Kostold meg!</h1><p id="kostoldMeg-p">Kostold meg ma az extra sajtos pikans cheddar jalapenos burgerunket!</p><h2>Heltai Jeno ter 2.</h2>
          </section>
          <img src="global-source/rustyCsipos.jpg" alt="cheddar">
        </div>
      </div>
      <div class="swiper-pagination"></div>
    </div>
  </main>
<script src="global-source/rustyDeerEyeGlow.js"></script>
<script src="rusty-main-source/script.js"></script>
<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
<script>
  var swiper = new Swiper(".mySwiper", {
    slidesPerView: 1,
    spaceBetween: 100,
    loop: true,
    autoplay: {
      delay: 5000,
      disableOnInteraction: false,
    },
    pagination: {
      el: ".swiper-pagination",
      clickable: true,
    },
  });
</script>
<!-- Swiper JS END -->
</body>
</html>
