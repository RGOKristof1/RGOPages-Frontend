<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGOPages</title>
    <link rel="shortcut icon" href="home-source/media/rgopages.ico" type="image/x-icon">
    <link rel="stylesheet" href="/global-source/global-style.css">
    <link rel="stylesheet" href="home-source/styles/home-main-style.css">
    <link rel="stylesheet" href="home-source/styles/home-responsive-style.css">
</head>
<body>
    <header>
        <div id="logo">
            <a id="logo-rgo" title="Rólam" href="https://rgopages.hu/nevjegy">RGO</a><a id="logo-pages" title="Összes listázott oldal" href="https://rgopages.hu/pages">Pages</a>
        </div>
        <div id="search">
            <form id="search-form" autocomplete="off">
                <input
                autocomplete="off"
                type="text"
                id="search-box"
                class="header-boxes"
                placeholder="Keress az oldalak kozott"
                enterkeyhint="search"
                >
                <input
                type="submit"
                id="search-button"
                value="Keress"
                >
            </form>
        </div>

        <nav id="menu">
            <button id="login-button" class="header-boxes">Login</button>
        </nav>
    </header>
    <main>
        <H1 id="output">NONE</H1>
    </main>
    <script src="home-source/scripts/main.js" defer></script>
</body>
</html>
