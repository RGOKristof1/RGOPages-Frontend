<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nothin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #fff;
  }
  body {
    display: flex;
    align-items: center;      /* vertical center */
    justify-content: center;  /* horizontal center */
    font-family: "Space Mono", ui-monospace, Menlo, Consolas, monospace;
    overflow: hidden;
  }
  #wrap {
    position: relative;       /* anchor for the badge and the end-time label */
  }
  #display {
    font-size: clamp(3rem, 18vw, 14rem);
    font-weight: 700;
    line-height: 1;
    text-align: center;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  /* Lesson badge above the top-right corner of the main timer. Absolutely
     positioned, so the main timer / idle text always stays perfectly centered. */
  #badge {
    position: absolute;
    bottom: 100%;
    right: 0;
    margin-bottom: 0.6rem;
    padding: 0.2em 0.9em;
    border: 1px solid currentColor;   /* follows the timer's final color */
    border-radius: 999px;
    white-space: nowrap;
    font-size: clamp(0.8rem, 2.2vw, 1.3rem);   /* change this to make it bigger/smaller */
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  #badge:empty { display: none; }
  /* Small label under the main timer. It is positioned absolutely, so the main
     timer / idle text always stays perfectly centered. The grid keeps the end
     clock alone in the middle column (exactly centered); the next break length
     sits in the right column, a bit to the right of the center. */
  #endtime {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    margin-top: 0.6rem;
    white-space: nowrap;
    font-size: clamp(0.8rem, 2.2vw, 1.3rem);   /* change this to make it bigger/smaller */
    font-weight: 400;
    letter-spacing: 0.08em;
  }
  #endclock { grid-column: 2; }
  #nextbreak {
    grid-column: 3;
    justify-self: start;
    margin-left: 1.4em;       /* distance from the end clock */
  }
  #endtime span:empty { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="badge"></div>
  <div id="display">nothin</div>
  <div id="endtime"><span id="endclock"></span><span id="nextbreak"></span></div>
</div>

<script>
/* ==========================================================
   CONFIGURATION: edit only this block
   ========================================================== */

// Text shown while no countdown is running.
const IDLE_TEXT = "Nothin";

// The countdown sequence starts at this time, in the timezone below.
const START_HOUR = 8;
const START_MINUTE = 0;

// Timezone used for the start time and the end-time label. It follows
// daylight saving automatically (GMT+2 in summer, GMT+1 in winter for Budapest).
const TIMEZONE = "Europe/Budapest";

// Days of the week the sequence runs on (in TIMEZONE):
// 0 = Sunday, 1 = Monday ... 6 = Saturday.  [1, 2, 3, 4, 5] = Monday to Friday.
// On the other days the page just shows IDLE_TEXT.
// Ignored when ONLY_DATE is set or TEST_START_NOW is true.
const ACTIVE_DAYS = [1, 2, 3, 4, 5];

// null  = the sequence runs every active day at START_HOUR:START_MINUTE.
// "2026-10-05" = it runs only on that date (format YYYY-MM-DD).
const ONLY_DATE = null;

// HOW TO SET THE CYCLES:
// Every line below is one countdown: [ type, minutes ].
//   "focus" = the long timer  (fades white -> pastel green)
//   "break" = the short timer (fades white -> pastel red)
// - Add or remove lines to change the number of cycles.
// - Change the number to change the duration (decimals work, e.g. 0.5 = 30 seconds).
// - The order of the lines is the order they run in.
// When the last line finishes, the page goes straight back to IDLE_TEXT.
const SCHEDULE = [
  ["focus", 45],//1
  ["break", 10], 
  ["focus", 45],//2
  ["break", 15],
  ["focus", 45],//3
  ["break", 10],
  ["focus", 45],//4
  ["break", 10],
  ["focus", 45],//5
  ["break", 25],
  ["focus", 45],//6
  ["break", 10],
  ["focus", 45],//7
  ["break", 5],
  ["focus", 45],//8
  ["break", 5],
  ["focus", 45],//9
];

// Small label under the timer showing the clock time when the current timer ends
// (e.g. 11:35). It has the final color of the current timer (green / red) the whole time.
const SHOW_END_TIME = true;

// To the right of the end-time label: the length of the upcoming break (always gold), e.g. 5′.
// Only shown during a "focus" timer that is followed by a "break", never during a break.
const SHOW_NEXT_BREAK = true;

// Badge in the top-right corner of the main timer: which lesson we are in.
// A "focus" timer and the "break" after it count as the same lesson,
// the next "focus" starts the next lesson. Shown during breaks too.
const SHOW_LESSON_BADGE = true;

// Lessons (by number, same numbering as the badge) that use GOLD instead of
// pastel green: the 45 timer, the small end clock and the lesson badge.
// The break after such a lesson stays red. Empty list [] = no gold lessons.
const GOLD_LESSONS = [5];

// Testing: set to true to start the sequence the moment the page loads,
// instead of waiting for START_HOUR (also works on weekends).
// Set it back to false when you are done.
const TEST_START_NOW = false;

// Colors (RGB). Each timer fades from WHITE to its target color.
const WHITE = [255, 255, 255];
const TARGET = {
  focus: [152, 224, 160],  // pastel green
  break: [255, 140, 140],  // pastel red
  gold:  [255, 200, 64],   // gold (GOLD_LESSONS and the next break length)
};

/* ==========================================================
   LOGIC: no need to edit below
   ========================================================== */

const el = document.getElementById("display");
const badgeEl = document.getElementById("badge");
const endEl = document.getElementById("endtime");
const endClockEl = document.getElementById("endclock");
const nextBreakEl = document.getElementById("nextbreak");
const total = SCHEDULE.reduce((sum, [, min]) => sum + min * 60000, 0);
const pageLoadedAt = Date.now();

const clockFormat = new Intl.DateTimeFormat("en-GB", {
  timeZone: TIMEZONE, hour: "2-digit", minute: "2-digit", hourCycle: "h23",
});

// Offset (ms) of TIMEZONE from UTC at the given instant, DST-aware.
function tzOffsetMs(utcMs) {
  const p = {};
  new Intl.DateTimeFormat("en-US", {
    timeZone: TIMEZONE, hourCycle: "h23",
    year: "numeric", month: "numeric", day: "numeric",
    hour: "numeric", minute: "numeric", second: "numeric",
  }).formatToParts(new Date(utcMs)).forEach(x => p[x.type] = x.value);
  const asUtc = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
  return asUtc - Math.floor(utcMs / 1000) * 1000;
}

// Start of today's sequence (ms), or null if today is not an active day.
function sequenceStart(now) {
  if (TEST_START_NOW) return pageLoadedAt;
  let y, m, d;
  if (ONLY_DATE) {
    [y, m, d] = ONLY_DATE.split("-").map(Number);
    m -= 1;
  } else {
    const local = new Date(now + tzOffsetMs(now)); // wall clock in TIMEZONE, read via UTC getters
    if (!ACTIVE_DAYS.includes(local.getUTCDay())) return null;
    y = local.getUTCFullYear();
    m = local.getUTCMonth();
    d = local.getUTCDate();
  }
  const wall = Date.UTC(y, m, d, START_HOUR, START_MINUTE, 0); // 8:00 as if it were UTC
  let start = wall - tzOffsetMs(wall);
  start = wall - tzOffsetMs(start); // re-check, in case the offset differs at that instant
  return start;
}

function mix(from, to, t) {
  return from.map((c, i) => Math.round(c + (to[i] - c) * t));
}

function rgb(c) { return "rgb(" + c.join(",") + ")"; }

function pad(n) { return String(n).padStart(2, "0"); }

// 10 -> "10′", 0.5 -> "30″" (prime = minutes, double prime = seconds)
function formatLength(min) {
  return Number.isInteger(min) ? min + "′" : Math.round(min * 60) + "″";
}

function showIdle() {
  el.textContent = IDLE_TEXT;
  el.style.color = "#fff";
  badgeEl.textContent = "";
  endClockEl.textContent = "";
  nextBreakEl.textContent = "";
}

function tick() {
  const now = Date.now();
  const start = sequenceStart(now);

  // Not an active day: idle text only.
  if (start === null) return showIdle();

  const elapsed = now - start;

  // Before the start time, or after the last cycle: idle text only.
  if (elapsed < 0 || elapsed >= total) return showIdle();

  // Find the current countdown inside the sequence.
  let offset = 0;
  let lesson = 0;
  for (let i = 0; i < SCHEDULE.length; i++) {
    const [type, min] = SCHEDULE[i];
    const len = min * 60000;
    if (type === "focus") lesson++;   // a break keeps the number of the lesson before it
    if (elapsed < offset + len) {
      const inSegment = elapsed - offset;
      const remaining = Math.ceil((len - inSegment) / 1000);
      el.textContent = pad(Math.floor(remaining / 60)) + ":" + pad(remaining % 60);
      // Gold lessons fade to gold instead of green; breaks are always red.
      const target = (type === "focus" && GOLD_LESSONS.includes(lesson)) ? TARGET.gold : TARGET[type];
      el.style.color = rgb(mix(WHITE, target, inSegment / len));

      // Everything below uses the fixed final color of this timer.
      const finalColor = rgb(target);

      badgeEl.textContent = SHOW_LESSON_BADGE ? lesson + ". óra" : "";
      badgeEl.style.color = finalColor;

      endEl.style.color = finalColor;
      endClockEl.textContent = SHOW_END_TIME ? clockFormat.format(new Date(start + offset + len)) : "";

      // Next break length: only during a focus timer that is followed by a break.
      const next = SCHEDULE[i + 1];
      if (SHOW_NEXT_BREAK && type === "focus" && next && next[0] === "break") {
        nextBreakEl.textContent = formatLength(next[1]);
        nextBreakEl.style.color = rgb(TARGET.gold);
      } else {
        nextBreakEl.textContent = "";
      }
      return;
    }
    offset += len;
  }
}

tick();
setInterval(tick, 200);
</script>
</body>
</html>
