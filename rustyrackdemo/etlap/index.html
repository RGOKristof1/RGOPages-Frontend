<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--Page Icon-->
  <link rel="shortcut icon" href="/rustyrackdemo/rusty-global-source/images/rustyDeerWithEye.webp" type="image/x-icon">
  <!--Styles-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
  <link rel="stylesheet" href="/rustyrackdemo/rusty-global-source/basic-style.css">
  <link rel="stylesheet" href="/rustyrackdemo/etlap/rusty-etlap-source/style.css">
  <!--Page Title-->
  <title id="title">Etlap</title>
</head>
<body>
  <header>
    <div id="header-left">
      <a><img src="/rustyrackdemo/rusty-global-source/images/rustyDeerNoEye.webp" alt="deer" id="logo-img"></a>
      <button id="lang-selector" onclick="toggleLanguage()">
        <img src="/rustyrackdemo/rusty-global-source/images/american-flag.webp" alt="usa-flag" id="lang-img">
        <p id="lang-text">EN</p>
      </button> 
    </div>

    <div id="header-center">
      <a href="/rustyrackdemo/"><img src="/rustyrackdemo/rusty-global-source/images/rustyBanner.webp" alt="banner" id="banner-img"></a>
    </div>

    <div id="header-right">
      <a href="/rustyrackdemo/" id="etlap-button">Főoldal</a>
    </div>
  </header>

  <main>
    <img src="/rustyrackdemo/etlap/rusty-etlap-source/images/rustyMenu1.webp" alt="">
    <img src="/rustyrackdemo/etlap/rusty-etlap-source/images/rustyMenu2.webp" alt="">
  </main>
<script src="/rustyrackdemo/rusty-global-source/rustyDeerEyeGlow.js"></script>
<script src="/rustyrackdemo/etlap/rusty-etlap-source/script.js"></script>
<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
<script>
  var swiper = new Swiper(".mySwiper", {
    slidesPerView: 1,
    spaceBetween: 100,
    loop: true,
    autoplay: {
      delay: 5000,
      disableOnInteraction: false,
    },
    pagination: {
      el: ".swiper-pagination",
      clickable: true,
    },
  });
</script>
<!-- Swiper JS END -->
</body>
</html>
