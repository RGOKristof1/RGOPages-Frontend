<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kréta API demo</title>
<style>
:root{color-scheme:light dark;--bg:#eef1f6;--pane:#fff;--ink:#1b2430;--mute:#5d6b7e;--line:#d5dbe5;--acc:#3446c8;--accfg:#fff;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#141922;--pane:#1b212c;--ink:#e6eaf2;--mute:#93a0b4;--line:#2c3544;--acc:#8fa2ff;--accfg:#10153a;--bad:#ff8a80}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:grid;grid-template-columns:320px 1fr;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
aside{padding:24px 20px;border-right:1px solid var(--line)}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--mute);font-size:13px;margin:0 0 20px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input:not([type=checkbox]){width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--pane);color:inherit;font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;color:inherit;cursor:pointer}
.go{width:100%;margin-top:16px;padding:9px;border:0;border-radius:4px;background:var(--acc);color:var(--accfg);font-weight:600}
.link{border:0;background:none;color:var(--acc);padding:0;text-decoration:underline}
.msg{font-size:13px;min-height:1.4em;margin:8px 0 0}.bad{color:var(--bad)}
.who{display:flex;justify-content:space-between;gap:8px;margin:0 0 12px;font-size:13px}
nav{display:flex;flex-direction:column;border-top:1px solid var(--line)}
nav button{text-align:left;padding:8px 10px;border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;background:none}
nav button:hover{background:var(--pane)}
nav button.on{border-left-color:var(--acc);background:var(--pane);font-weight:600}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px}
.pane{background:var(--pane);padding:20px 24px;min-width:0}
.req{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:10px 12px;background:var(--bg);border-left:3px solid var(--acc);word-break:break-all;margin:0 0 16px}
.req.bad{border-left-color:var(--bad)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;white-space:nowrap}
tr.k{cursor:pointer}tr.k:hover{background:var(--bg)}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace}
.cnt{color:var(--mute);font-size:13px}
@media(max-width:820px){body{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<aside>
  <h1>Kréta API demo</h1>
  <p class="sub">Az ekreta-docs-v3 leírása alapján. A jelszó közvetlenül a Krétának megy, a tokenek csak a böngésző memóriájában élnek.</p>
  <div id="login">
    <label for="school">Iskola (név vagy település)</label>
    <input id="school" list="schools" autocomplete="off">
    <datalist id="schools"></datalist>
    <label for="user">Felhasználónév (OM azonosító)</label>
    <input id="user" autocomplete="username">
    <label for="pass">Jelszó</label>
    <input id="pass" type="password" autocomplete="current-password">
    <button class="go" id="go">Bejelentkezés</button>
    <p class="msg" id="lmsg"></p>
  </div>
  <div id="app" hidden>
    <p class="who"><b id="who"></b><button class="link" id="out">Kijelentkezés</button></p>
    <nav id="eps"></nav>
    <div class="dates">
      <label>Ettől<input type="date" id="from"></label>
      <label>Eddig<input type="date" id="to"></label>
    </div>
    <label class="chk"><input type="checkbox" id="raw"> Nyers JSON</label>
  </div>
</aside>
<section class="pane" id="res"><p class="req">Jelentkezz be, majd válassz egy végpontot.</p></section>

<script>
const $=s=>document.querySelector(s);
const el=(t,x,p)=>{const e=document.createElement(t);if(x!=null)e.textContent=x;if(p)p.append(e);return e};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const D=d=>d?new Date(d).toLocaleDateString('hu-HU'):'';
const DT=d=>d?new Date(d).toLocaleString('hu-HU',{dateStyle:'short',timeStyle:'short'}):'';
const HM=d=>d?new Date(d).toLocaleTimeString('hu-HU',{hour:'2-digit',minute:'2-digit'}):'';
const by=(k,dir=1)=>(a,b)=>dir*String(a[k]||'').localeCompare(String(b[k]||''));

const EPS=[['student','Tanuló adatlap'],['grades','Jegyek'],['absences','Hiányzások'],['timetable','Órarend'],
 ['exams','Bejelentett számonkérések'],['homework','Házi feladatok'],['notes','Feljegyzések'],['events','Faliújság'],
 ['groups','Osztályok és csoportok'],['capabilities','Intézmény beállításai'],['inbox','Beérkezett üzenetek']];
const DATED=new Set(['timetable','grades','absences','exams','homework','notes']);

// Mezőnevek a repo README-jéből. Ami nincs itt, azt nyers JSON-ként mutatjuk.
const VIEWS={
 grades:{sort:by('KeszitesDatuma',-1),cols:{Dátum:r=>D(r.KeszitesDatuma),Tantárgy:r=>r.Tantargy?.Nev,Érték:r=>r.SzovegesErtek||r.SzamErtek,
  Súly:r=>r.SulySzazalekErteke?r.SulySzazalekErteke+'%':'',Típus:r=>r.Tipus?.Leiras,Téma:r=>r.Tema,Tanár:r=>r.ErtekeloTanarNeve}},
 absences:{sort:by('Datum',-1),cols:{Dátum:r=>D(r.Datum),Tantárgy:r=>r.Tantargy?.Nev,Óra:r=>r.Ora?.Oraszam,Típus:r=>r.Tipus?.Leiras,
  Igazolás:r=>r.IgazolasAllapota,'Késés (perc)':r=>r.KesesPercben}},
 timetable:{sort:by('KezdetIdopont'),cols:{Nap:r=>D(r.KezdetIdopont),Óra:r=>r.Oraszam,Idő:r=>`${HM(r.KezdetIdopont)}–${HM(r.VegIdopont)}`,
  Tárgy:r=>r.Nev,Terem:r=>r.TeremNeve,Tanár:r=>r.HelyettesTanarNeve?`${r.HelyettesTanarNeve} (helyettes)`:r.TanarNeve,Téma:r=>r.Tema}},
 exams:{sort:by('Datum'),cols:{Dátum:r=>D(r.Datum),Óra:r=>r.OrarendiOraOraszama,Tantárgy:r=>r.TantargyNeve,Mód:r=>r.Modja?.Leiras,Téma:r=>r.Temaja,Tanár:r=>r.RogzitoTanarNeve}},
 inbox:{open:true,cols:{Dátum:r=>DT(r.uzenetKuldesDatum),Feladó:r=>r.uzenetFeladoNev,Tárgy:r=>r.uzenetTargy,Olvasott:r=>r.isElolvasva?'igen':'nem'}}
};

const PROXY='https://kreta-proxy.rgokristof.workers.dev';  // üres = közvetlen hívás a Krétának. Ha a böngésző CORS miatt blokkol, ide a Worker címe (https://xxx.workers.dev)
const CLIENT_ID='kreta-ellenorzo-mobile-android',NONCE_KEY='baSsxOwlU1jM',LIST_KEY='7856d350-1fda-45f5-822d-e1a2f3f1acf0';
const PATHS={student:'/ellenorzo/V3/Sajat/TanuloAdatlap',grades:'/ellenorzo/V3/Sajat/Ertekelesek',absences:'/ellenorzo/V3/Sajat/Mulasztasok',
 timetable:'/ellenorzo/V3/Sajat/OrarendElemek',exams:'/ellenorzo/V3/Sajat/BejelentettSzamonkeresek',homework:'/ellenorzo/V3/Sajat/HaziFeladatok',
 notes:'/ellenorzo/V3/Sajat/Feljegyzesek',events:'/ellenorzo/V3/Sajat/FaliujsagElemek',groups:'/ellenorzo/V3/Sajat/OsztalyCsoportok',
 capabilities:'/ellenorzo/V3/Sajat/Intezmenyek'};
const MAIL='https://eugyintezes.e-kreta.hu/api/v1/kommunikacio/postaladaelemek/';
let S=null; // {ist,at,rt,exp}: csak a böngésző memóriájában, újratöltéskor elvész
const now=()=>Date.now()/1000;

async function kf(u,o){
  try{return await fetch(PROXY?`${PROXY}/?u=${encodeURIComponent(u)}`:u,o)}
  catch{throw new Error('A böngésző blokkolta a kérést (valószínűleg CORS). Állíts be PROXY-t a szkript elején.')}
}
async function sign(msg){ // HMAC-SHA512, base64: ugyanaz, mint a kreta_v2.py-ban
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(NONCE_KEY),{name:'HMAC',hash:'SHA-512'},false,['sign']);
  return btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.sign('HMAC',k,new TextEncoder().encode(msg)))));
}
async function token(form,signed,ist,usr){
  const h={'Content-Type':'application/x-www-form-urlencoded; charset=utf-8'};
  if(signed){
    const nonce=(await(await kf('https://idp.e-kreta.hu/nonce')).text()).trim();
    Object.assign(h,{'X-AuthorizationPolicy-Key':await sign(ist.toUpperCase()+nonce+usr.toUpperCase()),
      'X-AuthorizationPolicy-Version':'v2','X-AuthorizationPolicy-Nonce':nonce});
  }
  const r=await kf('https://idp.e-kreta.hu/connect/token',{method:'POST',headers:h,body:new URLSearchParams(form)});
  return{status:r.status,j:await r.json().catch(()=>({}))};
}
async function refresh(){
  const{j}=await token({institute_code:S.ist,refresh_token:S.rt,grant_type:'refresh_token',client_id:CLIENT_ID},false);
  if(!j.access_token){S=null;throw new Error('Lejárt a munkamenet, jelentkezz be újra')}
  Object.assign(S,{at:j.access_token,rt:j.refresh_token||S.rt,exp:now()+(j.expires_in||3000)});
}
// A felület többi része változatlan: api(művelet, paraméterek, törzs)
async function api(a,p={},body){
  if(a==='me')return{j:{logged_in:!!S,institute:S?.ist},up:''};
  if(a==='logout'){S=null;return{j:{ok:true},up:''}}
  if(a==='institutes'){
    const r=await kf('https://kretaglobalmobileapi2.ekreta.hu/api/v3/Institute',{headers:{apiKey:LIST_KEY}});
    if(!r.ok)throw new Error('Az iskolalista nem érhető el');
    return{j:(await r.json()).map(s=>({code:s.instituteCode,name:s.name,city:s.city})),up:''};
  }
  if(a==='login'){
    const{status,j}=await token({userName:body.user,password:body.pass,institute_code:body.institute,grant_type:'password',client_id:CLIENT_ID},true,body.institute,body.user);
    if(!j.access_token)throw Object.assign(new Error('Sikertelen bejelentkezés'),{data:{status,detail:j}});
    S={ist:body.institute,at:j.access_token,rt:j.refresh_token,exp:now()+(j.expires_in||3000)};
    return{j:{ok:true},up:''};
  }
  if(!S)throw new Error('Nem vagy bejelentkezve');
  let u=p.ep==='message'?MAIL+encodeURIComponent(p.id):p.ep==='inbox'?MAIL+'beerkezett':`https://${S.ist.toLowerCase()}.e-kreta.hu`+PATHS[p.ep];
  const qs=new URLSearchParams();['datumTol','datumIg'].forEach(k=>p[k]&&qs.set(k,p[k]));
  if([...qs].length)u+='?'+qs;
  let r;
  for(let i=0;i<2;i++){
    if(S.exp-now()<30)await refresh();
    r=await kf(u,{headers:{Authorization:'Bearer '+S.at}});
    if(r.status!==401)break;
    S.exp=0;
  }
  const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={raw:t}}
  if(!r.ok)throw Object.assign(new Error(j.error||'HTTP '+r.status),{data:j});
  return{j,up:u};
}

// Iskolalista
const schools=new Map();
api('institutes').then(({j})=>{
  const dl=$('#schools');
  j.forEach(s=>{const k=`${s.name}, ${s.city} (${s.code})`;schools.set(k,s.code);el('option',null,dl).value=k});
}).catch(()=>{$('#lmsg').textContent='Az iskolalista nem töltődött be. Az iskola kódját kézzel is beírhatod.'});

$('#go').onclick=async()=>{
  const v=$('#school').value.trim(),code=schools.get(v)||v,m=$('#lmsg');
  m.className='msg';m.textContent='Bejelentkezés…';
  try{
    await api('login',{},{institute:code,user:$('#user').value.trim(),pass:$('#pass').value});
    $('#pass').value='';m.textContent='';show(code);
  }catch(e){
    m.className='msg bad';
    m.textContent=e.message+(e.data?.status?` (a Kréta válasza: ${e.data.status})`:'');
  }
};
$('#out').onclick=async()=>{await api('logout').catch(()=>{});location.reload()};
$('#raw').onchange=()=>last&&render(cur,last,lastUp);

function show(ist){
  $('#login').hidden=true;$('#app').hidden=false;$('#who').textContent=ist;
  const n=$('#eps');n.replaceChildren();
  EPS.forEach(([k,t])=>{const b=el('button',t,n);b.dataset.ep=k;b.onclick=()=>load(k)});
  $('#res').replaceChildren(el('p','Válassz egy végpontot a bal oldalon.',null)).className='pane';
  $('#res').firstChild.className='req';
}

const mon=new Date();mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
const sun=new Date(mon);sun.setDate(mon.getDate()+6);
let cur='',last=null,lastUp='';

async function load(ep,p={}){
  cur=ep;
  document.querySelectorAll('#eps button').forEach(b=>b.classList.toggle('on',b.dataset.ep===ep));
  if(ep==='timetable'&&!$('#from').value){$('#from').value=iso(mon);$('#to').value=iso(sun)} // az órarendhez kötelező a dátum
  const q={ep,...p};
  if(DATED.has(ep)){if($('#from').value)q.datumTol=$('#from').value;if($('#to').value)q.datumIg=$('#to').value}
  const box=$('#res');box.replaceChildren(el('p','Lekérés…',null));box.firstChild.className='req';
  try{const{j,up}=await api('call',q);last=j;lastUp=up;render(ep,j,up)}
  catch(e){
    box.replaceChildren();
    el('p',e.message,box).className='req bad';
    if(e.data)el('pre',JSON.stringify(e.data,null,2),box);
  }
}

function render(ep,j,up){
  const box=$('#res');box.replaceChildren();
  el('p',up?`GET ${up}`:ep,box).className='req';
  if(ep==='message'){
    const m=j.uzenet||{};
    const txt=new DOMParser().parseFromString(m.szoveg||'','text/html').body.textContent; // az üzenet HTML-jét szövegként mutatjuk
    el('h3',m.targy||'',box);
    el('p',`${m.feladoNev||''} (${m.feladoTitulus||''}), ${DT(m.kuldesDatum)}`,box).className='cnt';
    el('pre',txt,box);
    el('button','Vissza a listához',box).onclick=()=>load('inbox');
    return;
  }
  const v=VIEWS[ep];
  const w=el('div',null,box);w.className='scroll';
  if($('#raw').checked||!v||!Array.isArray(j)){el('pre',JSON.stringify(j,null,2),w);return}
  if(!j.length){el('p','Nincs találat.',box);return}
  const rows=v.sort?[...j].sort(v.sort):j;
  const t=el('table',null,w),h=el('tr',null,el('thead',null,t));
  Object.keys(v.cols).forEach(k=>el('th',k,h));
  const b=el('tbody',null,t);
  rows.forEach(r=>{
    const tr=el('tr',null,b);
    Object.values(v.cols).forEach(f=>el('td',f(r)??'',tr));
    if(v.open){tr.className='k';tr.onclick=()=>load('message',{id:String(r.azonosito)})}
  });
  el('p',`${rows.length} elem`,box).className='cnt';
}

api('me').then(({j})=>{if(j.logged_in)show(j.institute)}).catch(()=>{});
</script>
</body>
</html>
