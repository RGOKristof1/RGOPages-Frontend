<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Percs</title>
  <style>
    *{
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html{
      height: 100%;
      font-size: clamp(1.8rem, 1.2rem + 2.5vw, 3rem);
      background-color: black;
    }
    body{
      height: 100%;
    }
    .loader{
      display: flex;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100vw;
      z-index: 100;
    }
    .loader-half{ /*Add class .loader-half-coloring to animate!*/
      position: absolute;
      left: 0;
      height: 50%;
      width: 100%;
      background-color: black;
      transition: background-color 0.5s;
    }
    .loader-half-coloring{background-color: #1db954;}

    .loader-half-top{top: 0;} /*Add class .loader-half-top-animate-out to animate!*/
    .loader-half-top-animate-out{animation: loaderHalfTopOut 1s  ease-in-out forwards;}
    @keyframes loaderHalfTopOut {to{top: -50%;}}

    .loader-half-bottom{top: 50%;} /*Add class .loader-half-bottom-animate-out to animate!*/
    .loader-half-bottom-animate-out{animation: loaderHalfBottomOut 1s  ease-in-out forwards;}
    @keyframes loaderHalfBottomOut {to{top: 100%;}}

    .loader-logo{ /*Add class .loader-logo-animate-in and .loader-logo-animate-pulse and .loader-logo-animate-out to animate!*/
      position: absolute;
      bottom: -1rem;
      left: calc(50% - 1rem);
      height: 2rem;
      width: 2rem;
      z-index: 101;
    }
    .loader-logo-animate-in{animation: loaderLogoIn 1s ease-out forwards;}
    @keyframes loaderLogoIn {
      0%{transform: scale(2000%) rotate(180deg);}
      90%{transform: scale(90%);}
      100%{transform: scale(100%);}
    }
    .loader-logo-animate-pulse{animation: loaderLogoPulse 2s ease-in-out alternate infinite;}
    @keyframes loaderLogoPulse {100%{transform: scale(120%);}}
    .loader-logo-animate-out{animation: loaderLogoOut 1s ease-in-out forwards;}
    @keyframes loaderLogoOut {
      100%{
        opacity: 0;
        transform:scale(0);
      }
    }

  </style>
  <script defer>
    function startLoading() {

      document.querySelector(".loader-half-top").classList.add("loader-half-coloring")
      document.querySelector(".loader-half-bottom").classList.add("loader-half-coloring")

      document.querySelector(".loader-logo").classList.add("loader-logo-animate-in")
      setTimeout(() => {
        document.querySelector(".loader-logo").classList.replace("loader-logo-animate-in","loader-logo-animate-pulse")
      }, 1000);
      
    }
    function endLoading() {
      setTimeout(() => {
        document.querySelector(".loader-logo").classList.add("loader-logo-animate-pulse","loader-logo-animate-out")
        document.querySelector(".loader-half-top").classList.add("loader-half-top-animate-out")
        document.querySelector(".loader-half-bottom").classList.add("loader-half-bottom-animate-out")

      }, 1000);
    }
  </script>
</head>
<body onload="endLoading()">
  <div class="loader">
    <div class="loader-half loader-half-top">
      <img 
        src="source/spotifypercslogo-front.webp" 
        alt="Spotify Percs Logo" 
        draggable="false" 
        class="loader-logo"
        onload="startLoading()"
      >
    </div>
    <div class="loader-half loader-half-bottom"></div>
  </div>
  <main>
    <img src="source/155603.jpg" alt="">
  </main>
</body>
</html>
