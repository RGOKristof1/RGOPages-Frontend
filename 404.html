<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - RGOPage Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300&display=swap" rel="stylesheet">
  <style>
    *{
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html{
      font-family: "Space Grotesk", sans-serif;
      font-optical-sizing: auto;
      font-weight: 300;
      font-style: normal;
      font-size: clamp(1.8rem, 1.2rem + 2.5vw, 3rem);
      background-color: #000;
      height: 100%;
    }
    body{
      background-color: #000;
      height: 100%;
      position: relative;
    }
    .background{
      height: 100%;
      position: relative;
      overflow: hidden;
    }
    .background-text{
      padding: .1rem;
      border-radius: 999px;
      background-color: rgba(0, 0, 0, .5);
      white-space: nowrap;
      overflow: hidden;
      position: absolute;
      color: white;
      left: 0;
      transform: translateX(-100%) translateY(-50%);
    }
    @keyframes backgroundTextMove {
      from{
        transform: translateX(-100%) translateY(-50%);
      }
      to{
        transform: translateX(calc(100vw + 100%)) translateY(-50%);
      }
    }
    .info-box{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
      white-space: nowrap;
      padding: 1.5ch 3ch;
      background-color: rgba(0, 0, 0, 0.8);
      animation: infoBoxFadeIn 1s ease-in-out;
      border: white solid 2px;
      border-radius: 1ch;
    }
    .info-box h1{
      font-size: 1.5rem;
    }
    .info-box p{
      font-size: 1rem;
    }
    .info-box a{
      font-size: 1.3rem;
    }
    .info-box hr{
      height: 2px;
      width: calc(100% + 1ch);
      margin: 1ch 0;
    }
    @media (max-width: 600px) {
      .info-box{
        padding: 1ch 2ch;
      }
      .info-box h1{
        font-size: 1rem;
      }
      .info-box p{
        font-size: .5rem;
      }
      .info-box a{
        font-size: .8rem;
      }
      .info-box hr{
        width: calc(100% + .5ch);
        margin: .5ch 0;
      }
    }
    a{
      color: inherit;
      text-decoration: none;
    }
    a:hover{
      text-shadow: 5px white;
      text-decoration: underline;
    }
    @keyframes infoBoxFadeIn {
      from{
        opacity: 0;
      }
      to{
        opacity: 1;
      }
    }
  </style>
  <script>
    function getRandomArbitrary(min, max) {
      return Math.random() * (max - min) + min;
    }
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    function getRandomText() {
      switch (getRandomInt(1, 10)) {
        case 1:
          return "RGOPages";
        case 2:
          return "Not Found!";
        case 3:
          return "Lost?";
        case 4:
          return "Nothing Here.";
        case 5:
          return "Void.";
        case 6:
          return "Error!";
        case 7:
          return "Nope.";
        case 8:
          return "Page Missing!";
        case 9:
          return "???";
        default:
          return "404";
      }
    }
    function backgroundTextMarkup() {
      return `<div class="background-text" style="
        font-size: .${getRandomInt(5, 9)}rem;
        animation: backgroundTextMove 10s linear infinite ${getRandomArbitrary(1, 11)}s;
        opacity: ${getRandomInt(50, 70)}%;
        top: ${getRandomInt(0, 100)}%;
      ">${getRandomText()}</div>`;
    }
    function addBackgroundTexts() {
      const count = Math.floor(window.innerWidth / 30);
      let html = "";
      for (let i = 0; i < count; i++) {
        html += backgroundTextMarkup();
      }
      document.querySelector(".background").innerHTML = html;
    }
    document.addEventListener("DOMContentLoaded", addBackgroundTexts);
  </script>
</head>
<body>
  <div class="background"></div>
  <div class="info-box">
    <h1>404</h1>
    <p>RGOPage not found!</p>
    <hr>
    <a href="https://rgopages.hu">Home</a>
  </div>
</body>
</html>
