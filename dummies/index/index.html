<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="home-source/rgopages.ico" type="image/x-icon">
    <link rel="stylesheet" href="/global-source/global-style.css">

<body>
    <header>
        <div id="logo">
            <a id="logo-rgo" title="Rólam" href="https://rgopages.hu/nevjegy">RGO</a><a id="logo-pages" title="Összes listázott oldal" href="https://rgopages.hu/pages">Pages</a>

        <div id="search">
            <form id="search-form" autocomplete="off">
                <input
                autocomplete="off"
                type="text"
                id="search-box"
                class="header-boxes"
                placeholder="Keress az oldalak kozott"
                enterkeyhint="search"
                >
                <input
                type="submit"
                id="search-button"
                value="Keress"
                >
            </form>
        </div>

        <nav id="menu">
            <button id="login-button">Login</button>
            
            <button id="other-button" class="" onclick="toggleMenu()">·<br>·<br>·</button>
            <button class="other-buttons other-hidden other-open">profile</button>
        </nav>
    </header>
    <main>
    </main>
    <script src="home-source/scripts/search.js"></script>
    <script src="home-source/scripts/menu.js"></script>
</body>
</html>
